name: Build APK
on: [push, workflow_dispatch]
env:
  APP_ID: com.docera.parwez
  APP_NAME: Docera
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q docera_biometric.zip -d work
      - name: Download PDF libraries
        run: |
          A=work/app/src/main/assets
          B=https://cdnjs.cloudflare.com/ajax/libs
          curl -fsSL --retry 3 -o $A/pdf.min.js $B/pdf.js/3.11.174/pdf.min.js
          curl -fsSL --retry 3 -o $A/pdf.worker.min.js $B/pdf.js/3.11.174/pdf.worker.min.js
          curl -fsSL --retry 3 -o $A/html2canvas.min.js $B/html2canvas/1.4.1/html2canvas.min.js
          curl -fsSL --retry 3 -o $A/jspdf.umd.min.js $B/jspdf/2.5.1/jspdf.umd.min.js
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.3.1 }
      - name: Build debug APK
        working-directory: work
        run: gradle assembleDebug -PappId="$APP_ID" -PappName="$APP_NAME" -PverCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: work/app/build/outputs/apk/debug/*.apk
